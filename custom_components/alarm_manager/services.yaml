trigger_alarm:
  name: Trigger Alarm
  description: Manually trigger an Alarm Manager alarm. Useful for alarms without conditions and for external automations.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID of the alarm to trigger.
      required: true
      selector:
        text:

create_alarm:
  name: Create Alarm
  description: Create a new alarm and start monitoring the selected Home Assistant entity.
  fields:
    name:
      name: Name
      description: A descriptive name for the alarm.
      required: true
      example: Living Room Temperature High
      selector:
        text:

    entity_id:
      name: Alarm Entity
      description: The primary Home Assistant entity associated with this alarm. Leave empty for a manual alarm.
      required: false
      selector:
        entity:

    condition:
      name: Condition
      description: The condition that activates the alarm.
      required: true
      selector:
        select:
          options:
            - "above"
            - "below"
            - "equal"
            - "not_equal"
            - "on"
            - "off"
            - "unavailable"

    threshold:
      name: Threshold
      description: Numeric threshold used by above, below, equal and not_equal.
      required: false
      example: 30
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.1
          mode: box

    conditions:
      name: Conditions
      description: Optional list of entity/time conditions. Leave empty for a manually triggered alarm.
      required: false
      selector:
        object:

    logic:
      name: Logic
      description: How multiple conditions are combined.
      required: false
      default: all
      selector:
        select:
          options:
            - "all"
            - "any"

    severity:
      name: Severity
      description: Alarm severity.
      required: false
      default: "warning"
      selector:
        select:
          options:
            - "info"
            - "warning"
            - "alarm"
            - "critical"

    delay:
      name: Activation Delay
      description: Number of seconds the condition must remain active before the alarm activates.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          step: 1
          mode: box
          unit_of_measurement: seconds

    hysteresis:
      name: Hysteresis
      description: Hysteresis value used to prevent alarm chatter around a threshold.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box


acknowledge_alarm:
  name: Acknowledge Alarm
  description: Acknowledge one active alarm.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID of the alarm to acknowledge.
      required: true
      selector:
        text:


clear_alarm:
  name: Clear Alarm
  description: Clear a latched inactive alarm without acknowledging the completed occurrence.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID of the inactive alarm to clear from Current Alarms.
      required: true
      selector:
        text:


acknowledge_all:
  name: Acknowledge All
  description: Acknowledge all currently active and unacknowledged alarms.


clear_history:
  name: Clear Alarm History
  description: Permanently clear all completed alarm occurrences from Alarm Manager history.


remove_alarm:
  name: Remove Alarm
  description: Permanently remove an alarm and stop monitoring its entity.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID of the alarm to remove.
      required: true
      selector:
        text:
update_alarm:
  name: Update Alarm
  description: Update an existing Alarm Manager alarm, including its condition group.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID of the alarm to update.
      required: true
      selector:
        text:
    name:
      name: Name
      description: A descriptive name for the alarm.
      required: true
      selector:
        text:
    conditions:
      name: Conditions
      description: Optional condition group. Leave empty for a manual alarm that does not trigger automatically.
      required: false
      selector:
        object:
    logic:
      name: Logic
      description: How multiple conditions are combined.
      required: false
      default: all
      selector:
        select:
          options:
            - "all"
            - "any"
    severity:
      name: Severity
      description: Alarm severity.
      required: false
      default: warning
      selector:
        select:
          options:
            - "info"
            - "warning"
            - "alarm"
            - "critical"
    delay:
      name: Activation Delay
      description: Number of seconds the condition group must remain true before activation.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          step: 1
          mode: box
    hysteresis:
      name: Hysteresis
      description: Hysteresis value.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box


set_default_notification:
  name: Set Default Notification
  description: Set the fallback Home Assistant notify service used by Alarm Manager.
  fields:
    notification_service:
      name: Notification Service
      description: Notify service name without the notify. prefix.
      required: true
      selector:
        text:


set_notification_targets:
  name: Set Notification Targets
  description: Replace Alarm Manager notification targets and severity routing.
  fields:
    targets:
      name: Targets
      description: Named Home Assistant notify services.
      required: true
      selector:
        object:
    routing:
      name: Severity Routing
      description: Map of severity names to target names.
      required: true
      selector:
        object:
